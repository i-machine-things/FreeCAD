name: Sync fork main with upstream

# Tracks upstream FreeCAD's latest tagged *release*, not the main branch tip —
# bleeding-edge main can be mid-refactor or temporarily broken on any given day.
# Fast-forward is a no-op (harmless) if fork main is already at or past the
# resolved tag, which is expected whenever main was more recently ahead of the
# latest release; the next sync that matters is whenever upstream cuts a release
# past where fork main currently sits.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC nightly
  workflow_dispatch:       # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve latest upstream release tag and fast-forward
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG=$(gh release list --repo FreeCAD/FreeCAD --limit 1 \
            --exclude-pre-releases --json tagName -q '.[0].tagName')
          echo "Latest upstream release: ${TARGET_TAG}"

          git remote add upstream https://github.com/FreeCAD/FreeCAD.git
          git fetch upstream "refs/tags/${TARGET_TAG}" --no-tags
          git merge --ff-only FETCH_HEAD

      - name: Push to fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" main
