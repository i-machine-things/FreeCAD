name: Fork PR Build & Test

# Builds a PR's own branch content on both Windows and Linux on every push,
# and runs the ctest suite on Linux (see the Test step below for why not
# Windows too). Unlike fork_test_build.yml (which patches a fixed DXF file
# list onto a clean upstream release, specifically for that narrowly-scoped
# contribution), this builds whatever is actually on the PR branch via the
# repo's own pixi configure/build/test tasks, so it validates any change —
# C++ or Python.
#
# This is a pass/fail build gate, not a release: it does not produce a
# downloadable installer or Flatpak. That remains fork_test_build.yml's job.

on:
  pull_request:
    branches: [release-parity]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to build (for re-running against an already-open PR)"
        required: true

permissions:
  contents: read

concurrency:
  group: fork-pr-build-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.event.pull_request.head.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      # No pinned pixi-version: this repo's root pixi.lock is on lock-file
      # format v7, which needs a newer pixi CLI than the v0.59.0 pin used by
      # fork_test_build.yml for the separate package/rattler-build/pixi.lock
      # (an older-format lock kept there for release-build reproducibility).
      # Tracking latest keeps this in step with whatever format the root
      # lockfile is committed at.
      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          cache: false

      # The root pixi.toml's CMake preset uses the Ninja generator, which
      # (unlike the Visual Studio generator) doesn't auto-discover cl.exe —
      # it needs an already-activated MSVC Developer Command Prompt.
      # fork_test_build.yml/fork_parity_release.yml never hit this because
      # they build through package/rattler-build's own recipe, which
      # activates MSVC itself; this workflow calls the root pixi tasks
      # directly, so it needs that activation done explicitly.
      - if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # `pixi run configure` depends on the `initialize` task, which runs
      # `git submodule update --init --recursive` itself.
      - name: Configure
        run: pixi run configure

      - name: Build
        run: pixi run build

      # Full ctest only on Linux. Neither existing fork workflow
      # (fork_test_build.yml, fork_parity_release.yml) runs ctest at all —
      # they only ever exercise one targeted script via freecadcmd.exe. On
      # Windows, running the full suite here surfaced why: several tests
      # exit with 0xc0000135 (STATUS_DLL_NOT_FOUND, no install step means
      # the build tree doesn't have every runtime DLL on PATH) and three
      # Qt-widget tests hang to a 25-minute timeout each with no display —
      # Linux gets a virtual one for free (xorg-x11-server-xvfb is already
      # a pixi dependency there), Windows has no equivalent set up in this
      # repo. Pre-existing gap, unrelated to whatever the PR actually
      # changed; Configure+Build succeeding on Windows is still real
      # signal that the CMake/compile side of a change is sound.
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: pixi run test
